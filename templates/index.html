{% extends "base.html" %}

{% block title %}
    Artists | Wave
{% endblock %}

{% block content %}
    <h1 class="my-4">Artists</h1>

    <ul class="list-group">
        {% for artist in artists %}
            <li class="list-group-item"><a href="{{ url_for('artist_page', artist_id=artist.artist_id)}}">{{artist.name}}</a></li>
        {% else %}
            <li class="list-group-item">No artists available.</li>
        {% endfor %}
    </ul>
{% endblock %}

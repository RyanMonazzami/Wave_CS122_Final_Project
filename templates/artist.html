{% extends "base.html" %}

{% block title %}
  {{artist.name}} | Wave
{% endblock %}


{% block content %}
    <h1 class="my-4">{{ artist.name }} — Albums</h1>

    <ul class="list-group">
        {% for album in albums %}
            <li class="list-group-item"><a href="{{ url_for('album_page', album_id=album.album_id)}}">{{album.title}}</a></li>
        {% else %}
            <li class="list-group-item">No albums available.</li>
        {% endfor %}
    </ul>
{% endblock %}

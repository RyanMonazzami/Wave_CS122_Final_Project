{% extends "base.html" %}

{% block title %}
  {{artist.name}} | Wave
{% endblock %}


{% block content %}
    <h1 class="my-4">{{ artist.name }}</h1>

    <ul class="catalog-grid">
        {% for album in albums %}
            <li>
                <a class="catalog-tile" href="{{ url_for('album_page', album_id=album.album_id) }}">
                    <span class="catalog-tile-artwork">
                        {% if album.artwork_filename %}
                            <img src="{{ url_for('static', filename=album.artwork_filename) }}" alt="">
                        {% endif %}
                    </span>
                    <span class="catalog-tile-title">{{ album.title }}</span>
                </a>
            </li>
        {% else %}
            <li class="catalog-empty">No albums available.</li>
        {% endfor %}
    </ul>
{% endblock %}

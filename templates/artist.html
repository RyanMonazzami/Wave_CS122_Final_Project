{% extends "base.html" %}

{% block title %}
  {{artist.name}} | Wave
{% endblock %}


{% block content %}
    <h1>{{ artist.name }} — Albums</h1>

    <ul>
        {% for album in albums %}
            <li><a href="{{ url_for('album_page', album_id=album.album_id)}}">{{album.title}}</a></li>
        {% else %}
            <li>No albums available.</li>
        {% endfor %}
    </ul>
{% endblock %}
